<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.4"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Animated Ambient Flow Elements (Deep Background) -->
  <g opacity="0.45">
    <!-- Git Branch Curve 1 -->
    <path d="M -100 280 C 250 280, 320 180, 580 180 C 840 180, 920 90, 1300 90" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="15s" repeatCount="indefinite"/>
    </path>

    <!-- Git Branch Curve 2 -->
    <path d="M -80 320 C 300 320, 420 220, 720 220 C 1020 220, 1080 120, 1320 120" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="20s" repeatCount="indefinite"/>
    </path>

    <!-- Subtle Data Flow Particles -->
    <circle r="4" fill="#60a5fa" filter="url(#glow)">
      <animateMotion path="M -100 280 C 250 280, 320 180, 580 180 C 840 180, 920 90, 1300 90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#ec4899" filter="url(#glow)">
      <animateMotion path="M -80 320 C 300 320, 420 220, 720 220 C 1020 220, 1080 120, 1320 120" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative Orbiting Glow Blobs -->
  <circle cx="1020" cy="70" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="300" r="120" fill="#a855f7" opacity="0.1" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Foreground Main Title & Content -->
  <g transform="translate(80, 50)">
    <!-- Pill Badge -->
    <g transform="translate(0, 10)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">DEVSECOPS &amp; ENTERPRISE VCS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome On-Premises Git Hosting
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="138" fill="#e2e8f0" font-size="18" font-weight="500">
      Curated Landscape of Self-Managed Git Servers, Enterprise Forges &amp; VCS Infrastructure
    </text>

    <text x="0" y="168" fill="#94a3b8" font-size="14" font-weight="400">
      Empowering zero-trust source control, sovereign data residency, air-gapped CI/CD, and code review governance.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#131c31" stroke="#2563eb" stroke-opacity="0.5" stroke-width="1"/>
        <text x="18" y="22" fill="#93c5fd" font-size="13" font-weight="600">⚡ Self-Hosted Forges</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(192, 0)">
        <rect width="190" height="34" rx="8" fill="#131c31" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
        <text x="18" y="22" fill="#c4b5fd" font-size="13" font-weight="600">🛡️ Air-Gapped Security</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(394, 0)">
        <rect width="180" height="34" rx="8" fill="#131c31" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1"/>
        <text x="18" y="22" fill="#f472b6" font-size="13" font-weight="600">🚀 CI/CD Pipelines</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(586, 0)">
        <rect width="190" height="34" rx="8" fill="#131c31" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
        <text x="18" y="22" fill="#6ee7b7" font-size="13" font-weight="600">🔍 Code Intelligence</text>
      </g>
    </g>
  </g>
</svg>
